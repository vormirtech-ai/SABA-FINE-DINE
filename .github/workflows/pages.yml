# ---------------------------------------------------------------------------
# GitHub Pages
# ---------------------------------------------------------------------------
# Everything in this repository is the site, already built. There is nothing
# to compile, so this workflow uploads the repository as it stands and
# deploys it.
#
# Pages has to be switched on once by a human, in Settings, Pages, Build and
# deployment, Source: GitHub Actions. The first run of this workflow tried to
# do it with `enablement: true` and GitHub refused — "Create Pages site
# failed: Resource not accessible by integration" — because a workflow token
# is not allowed to create the site. Asking again every run would only fail
# the same way, so it does not ask.
# ---------------------------------------------------------------------------

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is part-way through
# replacing the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check the site is whole before it goes live
        run: |
          for path in index.html demo/index.html demo/src/demo.js \
                      demo/styles/app.css docs/DEPLOYMENT.html .nojekyll; do
            test -e "$path" || { echo "missing: $path"; exit 1; }
          done
          echo "site looks whole:"
          du -sh .

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
